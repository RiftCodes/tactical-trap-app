<ion-content [fullscreen]="true">
    <div class="content">
        <img class="logo" src="../../assets/logo.png" (click)="clearTestOutput()">
        <div class="hr2"></div>
        <h1><div class="title">BLUETOOTH LOCK APPLICATION</div><ion-icon slot="end" name="menu" [ngClass]="{'dimmed' : optionsDisable}" (click)="openOptionsModal()"></ion-icon></h1>
        <div class="hr3"></div>
        <img class="lock-image" [src]="'../../assets/' + (showLockOpen ? 'open' : 'closed') + '-lock.png'">
        <img class="connect click-sounds" [hidden]="!connected || hideUnlockButton" [src]="'../../assets/disconnect-btn.png'" (click)="beginDisconnect()">
        <img class="connect click-sounds" [hidden]="connected" [src]="'../../assets/connect-btn.png'" (click)="beginConnect()">
        <img class="unlock click-sounds" [hidden]="hideUnlockButton" [src]="'../../assets/' + (showUnlockLabel ? 'unlock' : 'lock') + '-btn.png'" (click)="unlock(lockStatus.randData)">
        <!-- ion-button class="connect click-sounds" [hidden]="connected" (click)="beginConnect()" color="primary">
            BLUETOOTH CONNECT
        </ion-button>
        <ion-button class="connect click-sounds" [hidden]="!connected || hideUnlockButton" (click)="beginDisconnect()" color="primary">
            DISCONNECT
        </ion-button>
        <ion-button class="unlock click-sounds" [hidden]="hideUnlockButton" (click)="unlock(lockStatus.randData)" color="danger">
            {{showUnlockLabel ? 'UNLOCK' : 'LOCK'}}
        </ion-button -->
        <ion-spinner class="unlock-spinner" color="secondary" [ngClass]="{ 'unlock-spinner-reveal' : hideUnlockButton }" [hidden]="!(connected && hideUnlockButton)"></ion-spinner>
        <ion-card id="device-pane" [hidden]="hideDeviceList">
            <ion-card-header>
                <ion-card-title>
                    <span [hidden]="pairingState >= waiting">AVAILABLE DEVICES</span>
                    <span [hidden]="pairingState !== waiting">SELECT A DEVICE</span>
                    <span [hidden]="pairingState !== connecting">CONNECTING TO:</span>
                </ion-card-title>
            </ion-card-header>
            <ion-card-content>
                <div class="device-list" [hidden]="pairingState >= connecting">
                    <div class="item click-sounds" *ngFor="let device of devices" (click)="select(device)">{{device.name}}</div>
                </div>
                <div class="scanning" [hidden]="pairingState !== scanning">
                    Scanning
                    <ion-spinner></ion-spinner>
                </div>
                <div class="connecting" [hidden]="pairingState !== connecting">
                    <div class="selectedDevice">
                        {{selectedDevice.name}}
                    </div>
                    <ion-spinner></ion-spinner>
                </div>
                <ion-button [hidden]="pairingState >= connecting" class="click-sounds" (click)="cancel()">CANCEL</ion-button>
            </ion-card-content>
        </ion-card>
        <ble-lock-keypad id="keypad-pane" [hidden]="hideKeypad" [title]="'Enter 4-digit PIN'" [digits]="4" (pinValue)="pinEvent($event)"></ble-lock-keypad>
        <div class="test" [style.z-index]="testPaneDepth">{{testOutput}}</div>
    </div>


    <ion-fab *ngIf="debugMode.showFAB" vertical="bottom" horizontal="end">
        <ion-fab-button>Tools</ion-fab-button>

        <ion-fab-list side="start">
            <ion-fab-button class="click-sounds" (click)="debugMode.active = !debugMode.active">{{debugMode.active ? 'Hide' : 'Show'}}</ion-fab-button>
            <ion-fab-button class="click-sounds" (click)="showAlarmState()" *ngIf="connected">Alarm</ion-fab-button>
            <ion-fab-button class="click-sounds" (click)="unlock(lockStatus.randData)" *ngIf="connected">Unlock</ion-fab-button>
            <ion-fab-button class="click-sounds" (click)="beginDisconnect()" *ngIf="connected">Dsc</ion-fab-button>
            <ion-fab-button class="click-sounds" (click)="clearTestOutput()">Clear</ion-fab-button>
            <ion-fab-button class="click-sounds" (click)="bleService.initializeLock()" *ngIf="connected">Reset</ion-fab-button>
        </ion-fab-list>
    </ion-fab>

</ion-content>
